<section class="flex flex-col gap-10 items-center text-center max-w-3xl mx-auto w-full mt-8">
  <div class="flex flex-col gap-3">
    <h1 class="text-6xl leading-none tracking-tight font-extrabold">Discover your next favorite.</h1>
    <p class="text-lg leading-7 font-normal">Explore thousands of movies tailored to your sophisticated taste.</p>
  </div>


  <div class="w-full relative group">
    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
      <span class="material-symbols-outlined text-outline">search</span>
    </div>
    <input
      class="w-full border border-zinc-800 text-md leading-7 font-normal py-4 pl-12 pr-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-300 shadow-xl"
      placeholder="Search by title, director, or keyword..." type="text" />
  </div>

  <app-genre-selector (genreSelected)="onGenreSelected($event)"></app-genre-selector>
</section>

@if (movieResource.error()) {
  <div class="text-red-500 text-center mt-4">Failed to load movies. Please try again later.</div>
} @else if (movieResource.isLoading() && !loadedMovies().length) {
  <div class="text-gray-500 text-center mt-4">Loading movies...</div>
} @else {
  <app-movie-list
    [movies]="loadedMovies()"
    [isLoadingMore]="movieResource.isLoading()"
    [hasMorePages]="hasMorePages()"
    (nextPage)="loadNextPage()">
  </app-movie-list>
}
