<nav class="fixed top-0 w-full z-50 flex justify-between items-center h-16 px-6 max-w-full bg-zinc-950/80 backdrop-blur-md border-b border-zinc-800 shadow-2xl text-sm tracking-wide text-indigo-600">
  <div class="flex items-center gap-18">
    <a class="text-2xl md:text-3xl font-black text-white" href="#">
      Movies
    </a>
    <div class="hidden md:flex items-center gap-6">
      <a class="app-nav-link"
        href="#"
        routerLink="/"
        routerLinkActive="app-nav-link-active" [routerLinkActiveOptions]="{ exact: true }">
        Explore
      </a>
      @if (authService.authStatus() === 'authenticated') {
        <a class="app-nav-link"
          href="#"
          routerLink="/profile"
          routerLinkActive="app-nav-link-active" [routerLinkActiveOptions]="{ exact: true }">
          My Profile
        </a>
      }
      
    </div>
  </div>

  <div class="flex items-center gap-4">
    @if (authService.authStatus() === 'authenticated') {
      <span class="text-slate-200 font-semibold text-lg" >{{ authService.user()?.name }}</span>
      <button class="primary-button" type="button" (click)="authService.logout()">
        Logout
      </button>
    } @else if (authService.authStatus() === 'non-authenticated') {
      <button class="primary-button" type="button" [routerLink]="[{ outlets: { modal: ['login'] } }]">
        Login
      </button>
    } @else {
      <span>...</span>
    }
    


  </div>
</nav>
