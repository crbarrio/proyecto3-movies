<app-modal-shell
	[eyebrow]="'Account'"
	[title]="title()"
	[shellClass]="'app-modal-shell-narrow'"
	[bodyClass]="'app-modal-shell-body-form'"
	(close)="close()">
	<div class="space-y-3">
		@if (mode() === 'login') {
			<app-login-form [isSubmitting]="isSubmitting()" (formSubmited)="onLogin($event)"></app-login-form>
		} @else {
			<app-register-form [isSubmitting]="isSubmitting()" (formSubmited)="onRegister($event)"></app-register-form>
		}
	</div>

	@if (authError()) {
		<div>
		<p class="rounded-2xl border border-red-500/30 bg-red-500/10 px-4 py-3 text-sm text-red-200" role="alert">
			{{ authError() }}
		</p>
		</div>
	}

	<div class="rounded border border-white/10 bg-zinc-950/40 p-4 text-sm text-slate-400">
		<p>
			{{ alternatePrompt() }}
			<button
				type="button"
				class="ml-1 font-semibold text-white transition hover:cursor-pointer hover:text-indigo-400 disabled:cursor-not-allowed disabled:text-slate-500"
				[disabled]="isSubmitting()"
				(click)="openAlternateMode()">
				{{ alternateActionLabel() }}
			</button>
		</p>
	</div>
</app-modal-shell>
