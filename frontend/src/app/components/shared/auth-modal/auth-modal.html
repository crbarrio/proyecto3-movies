<div class="mx-auto flex w-full max-w-md flex-col overflow-hidden rounded-2xl border border-zinc-700 bg-zinc-900 text-slate-200 shadow-lg">
	<div class="flex shrink-0 items-center justify-between border-b border-white/10 px-6 py-4">
		<div>
			<p class="text-xs font-semibold uppercase tracking-[0.24em] text-slate-400">Account</p>
			<h2 class="text-lg font-semibold text-white">
				{{ title() }}
			</h2>
		</div>
		<button
			type="button"
			class="rounded-full border border-white/10 p-2 text-slate-300 transition hover:cursor-pointer hover:border-white/20 hover:bg-white/5 hover:text-white"
			(click)="close()"
			aria-label="Close modal">
			<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
				<path stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6L6 18" />
			</svg>
		</button>
	</div>

	<div class="space-y-6 px-6 py-8 md:px-8">
		<div class="space-y-3">
            @if (mode() === 'login') {
                <app-login-form></app-login-form>
            } @else {
                <app-register-form></app-register-form>
            }
		</div>

		<div class="rounded-2xl border border-white/10 bg-zinc-950/40 p-4 text-sm text-slate-400">
			<p>
				{{ alternatePrompt() }}
				<button
					type="button"
					class="ml-1 font-semibold text-white transition hover:cursor-pointer hover:text-indigo-400"
					(click)="openAlternateMode()">
					{{ alternateActionLabel() }}
				</button>
			</p>
		</div>
	</div>
</div>
