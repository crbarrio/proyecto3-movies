<div class="flex flex-col gap-1 cursor-pointer">
    <div class="group relative aspect-2/3 rounded-xl overflow-hidden shadow-lg border border-neutral-800">
        <img alt="{{movie().original_title}} Movie Poster"
            class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
            data-alt="{{movie().original_title}} Movie Poster"
            src="{{baseImageUrl}}{{movie().poster_path}}" />
        <div
            class="absolute inset-0 bg-linear-to-t from-background via-background/40 to-transparent opacity-80 group-hover:opacity-100 transition-opacity duration-300">
        </div>
        <div class="absolute top-3 w-full px-3 flex justify-between items-start z-10">
            <div
                class="bg-indigo-500/20 backdrop-blur-md border border-indigo-500/30 px-2 py-1 rounded text-indigo-500 leading-4 font-bold flex items-center gap-1 shadow-md">
                <span class="material-symbols-outlined text-[14px] fill">star</span>
                8.9
            </div>
            <button
                class="w-8 h-8 rounded-full bg-zinc-900/50 backdrop-blur-md flex items-center justify-center hover:text-red-800 hover:bg-neutral-800 transition-colors shadow-md">
                <span class="material-symbols-outlined">favorite</span>
            </button>
        </div>
    </div>
    <h3 class="text-indigo-500 leading-4 font-bold tracking-wider uppercase">{{movie().original_title}}</h3>
    <span class="font-h3 text-h3 leading-tight drop-shadow-lg">{{ genreNames().join(', ') }}</span>
</div>
