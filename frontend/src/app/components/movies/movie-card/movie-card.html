<div class="flex flex-col gap-1 cursor-pointer">
    <div class="group relative aspect-2/3 rounded-xl overflow-hidden shadow-lg border border-neutral-800">
        <a
            class="absolute inset-0 block"
            [attr.aria-label]="'Open details for ' + movie().title"
            [routerLink]="['/movie', movie().id]">
            @if (movie().posterPath) {
            <img alt="{{ movie().title }} Movie Poster"
                class="absolute inset-0 w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                src="{{ baseImageUrl }}{{ movie().posterPath }}" />
            } @else {
            <div
                class="flex aspect-2/3 h-full items-center justify-center bg-linear-to-br from-neutral-900 via-neutral-800 to-neutral-950 p-4 text-center text-xs font-semibold uppercase tracking-[0.3em] text-neutral-500">
                No poster
            </div>
            }
            <div
                class="pointer-events-none absolute inset-0 bg-linear-to-t from-background via-background/40 to-transparent opacity-80 group-hover:opacity-100 transition-opacity duration-300">
            </div>
        </a>
        <div class="pointer-events-none absolute top-3 w-full px-3 flex justify-between items-start z-10">
            @if (isAuthenticated()) {
                <span
                    class="min-w-8 h-8 rounded-full px-2 bg-zinc-900/50 backdrop-blur-md text-neutral-200 shadow-md flex items-center justify-center text-xs font-bold leading-none">
                    @if (movie().score !== undefined && movie().score !== null) {
                        {{ movie().score }}
                    } @else {
                        N/A
                    }
                </span>

                <div class="pointer-events-auto flex items-center gap-2">
                    <button
                        type="button"
                        (click)="onToggleWatched($event)"
                        [attr.aria-pressed]="movie().watched ? 'true' : 'false'"
                        [attr.aria-label]="movie().watched ? 'Mark ' + movie().title + ' as not watched' : 'Mark ' + movie().title + ' as watched'"
                        class="w-8 h-8 rounded-full bg-zinc-900/50 backdrop-blur-md text-neutral-200 hover:bg-neutral-800 transition-colors shadow-md flex items-center justify-center"
                        [class.text-emerald-300]="movie().watched">
                        <span class="material-symbols-outlined text-[14px] leading-none">
                            {{ movie().watched ? 'visibility' : 'visibility_off' }}
                        </span>
                    </button>

                    <button
                        type="button"
                        (click)="onToggleFavorite($event)"
                        [attr.aria-pressed]="movie().favorite ? 'true' : 'false'"
                        [attr.aria-label]="movie().favorite ? 'Remove ' + movie().title + ' from favorites' : 'Add ' + movie().title + ' to favorites'"
                        class="w-8 h-8 rounded-full bg-zinc-900/50 backdrop-blur-md text-neutral-200 hover:bg-neutral-800 transition-colors shadow-md flex items-center justify-center"
                        [class.text-red-400]="movie().favorite">
                        @if (movie().favorite) {
                            <span class="material-symbols-outlined text-[14px] leading-none" style="font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;">favorite</span>
                        } @else {
                            <span class="material-symbols-outlined text-[14px] leading-none" style="font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;">favorite</span>
                        }
                    </button>
                </div>
            }
        </div>
    </div>
    <h3 class="text-indigo-500 leading-4 font-bold tracking-wider uppercase" [routerLink]="['/movie', movie().id]">{{movie().title}}</h3>
    <span class="font-h3 text-h3 leading-tight drop-shadow-lg">{{ genreNames().join(', ') }}</span>
</div>
