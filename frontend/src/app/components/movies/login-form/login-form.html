<form class="space-y-5" (submit)="onSubmit($event)" novalidate>
	<div class="space-y-1.5">
		<label for="login-email" class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">
			Email
		</label>
		<input
            [attr.aria-invalid]="isFieldInvalid('email')"
            [attr.aria-describedby]="isFieldInvalid('email') ? 'login-email-error' : null"
            [class.form-input-invalid]="isFieldInvalid('email')"
            [formField]="loginForm.email"
			id="login-email"
			type="email"
			placeholder="name@company.com"
			class="w-full rounded-xl border border-white/10 bg-zinc-950/70 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-500 outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20"
		/>
        @if ( isFieldInvalid('email')) {
            <p id="login-email-error" class="text-red-500 text-sm" role="alert">
                @for (error of loginForm.email().errors(); track $index) {
                    {{ error.message }}
                }
            </p>
        }
	</div>

	<div class="space-y-1.5">

        <label for="login-password" class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">
            Password
        </label>

		<input
            [attr.aria-invalid]="isFieldInvalid('password')"
            [attr.aria-describedby]="isFieldInvalid('password') ? 'login-password-error' : null"
			id="login-password"
			type="password"
			placeholder="Enter your password"
            [class.form-input-invalid]="isFieldInvalid('password')"
            [formField]="loginForm.password"
			class="w-full rounded-xl border border-white/10 bg-zinc-950/70 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-500 outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20"
		/>
        @if ( isFieldInvalid('password')) {
            <p id="login-password-error" class="text-red-500 text-sm" role="alert">
                @for (error of loginForm.password().errors(); track $index) {
                    {{ error.message }}
                }
            </p>
        }
	</div>

	<button
		type="submit"
		class="primary-button w-full">
		Sign in
	</button>
</form>
