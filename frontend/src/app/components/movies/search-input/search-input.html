<div class="w-xs md:w-2xl relative group">
    <label class="sr-only" for="movie-search-input">Search movies by title</label>
    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
        <span class="material-symbols-outlined text-outline">search</span>
    </div>
    <input
        id="movie-search-input"
        class="w-full border border-zinc-800 text-md leading-7 font-normal py-4 pl-12 pr-4 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all duration-300 shadow-xl"
        placeholder="Search by title" 
        type="search"
        [(value)]="query"
        debounceTime="1000" />
</div>
