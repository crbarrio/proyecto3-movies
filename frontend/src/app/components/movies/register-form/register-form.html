<form class="space-y-5" action="#">
    <div class="space-y-1.5">
        <label for="register-name" class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">
            Name
        </label>
        <input
            id="register-name"
            name="name"
            type="text"
            placeholder="Your full name"
            class="w-full rounded-xl border border-white/10 bg-zinc-950/70 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-500 outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20"
        />
    </div>

    <div class="space-y-1.5">
        <label for="register-email" class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">
            Email
        </label>
        <input
            id="register-email"
            name="email"
            type="email"
            placeholder="name@company.com"
            class="w-full rounded-xl border border-white/10 bg-zinc-950/70 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-500 outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20"
        />
    </div>

    <div class="space-y-1.5">
        <label for="register-password" class="text-xs font-semibold uppercase tracking-[0.18em] text-slate-400">
            Password
        </label>
        <input
            id="register-password"
            name="password"
            type="password"
            placeholder="Create a secure password"
            class="w-full rounded-xl border border-white/10 bg-zinc-950/70 px-4 py-3 text-sm text-slate-100 placeholder:text-slate-500 outline-none transition focus:border-indigo-400 focus:ring-2 focus:ring-indigo-500/20"
        />
    </div>

    <button
        type="submit"
        class="w-full primary-button">
        Create account
    </button>
</form>
