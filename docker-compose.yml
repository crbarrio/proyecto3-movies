services:
  db:
    image: postgres:17
    container_name: proyecto3-movies-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-movies_db}
      POSTGRES_USER: ${DB_USER:-movies_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-movies_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -p 5432 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres_data: