services:
  db:
    image: mysql:8.4
    container_name: proyecto3-movies-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-movies_db}
      MYSQL_USER: ${DB_USER:-movies_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-movies_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  mysql_data: